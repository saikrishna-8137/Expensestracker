<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1b">
  <title>Reset Password | Family Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth-polish.css">
</head>
<body class="reset-page">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <nav class="top-navbar" aria-label="Main navigation">
    <a href="index.html" class="nav-logo"><span class="nav-symbol">₹</span> Family Expense Tracker</a>
    <div class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a></div>
  </nav>
  <main class="reset-main">
    <section class="card reset-card">
      <div class="brand-icon" aria-hidden="true">₹</div>
      <p class="eyebrow">ACCOUNT SECURITY</p>
      <h1>Reset password<span class="accent">.</span></h1>
      <p class="form-intro">Choose a new password for your account.</p>
      <form id="reset-password-form">
        <label for="new-password">New password</label>
        <div class="password-wrap">
          <input id="new-password" type="password" minlength="6" autocomplete="new-password" placeholder="At least 6 characters" required>
          <button type="button" class="password-toggle" data-password-target="new-password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" placeholder="Enter it again" required>
        <button class="primary-button full-button" type="submit">Update password <span>→</span></button>
      </form>
      <p id="reset-message" class="message" role="status" aria-live="polite"></p>
      <a class="back-home" href="index.html">← Back to login</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth-reset.js"></script>
</body>
</html>
